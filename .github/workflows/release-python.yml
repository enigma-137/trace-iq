name: Release Python SDK

# Push a tag like `python-v0.2.0` to publish sdks/python to PyPI as traceiq-py.
# Uses PyPI Trusted Publishing, so no API token is stored. See RELEASING.md.
on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('traceiq/__init__.py').read()).group(1))")
          if [ "$tag" != "$project" ] || [ "$tag" != "$module" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml ($project) and traceiq/__init__.py ($module)."
            exit 1
          fi
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: sdks/python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
