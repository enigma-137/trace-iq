name: Deploy to VPS

# Deploys main to the VPS after CI passes on it, or on demand from the Actions tab.
#
# Migrations run as part of `docker compose up`: the `migrate` service applies them
# and `api` only starts once it has exited successfully. A failed migration fails
# this job and leaves the previous API container running.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST         hostname or IP of the VPS
#   VPS_USER         SSH user that can run docker compose in /opt/traceiq
#   VPS_SSH_KEY      private key for that user (a dedicated deploy key)
#   VPS_KNOWN_HOSTS  output of `ssh-keyscan -H <host>`, so the host key is verified
# Optional:
#   VPS_PORT         SSH port (default 22)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Back up database, pull, build and migrate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "DEPLOY_SHA=$DEPLOY_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/traceiq

          echo "Backing up PostgreSQL..."
          backup_dir=/opt/traceiq-backups
          mkdir -p "$backup_dir"
          backup="$backup_dir/traceiq-$(date -u +%Y%m%dT%H%M%SZ)-${DEPLOY_SHA:0:7}.sql.gz"
          docker compose exec -T postgres pg_dump -U traceiq -d traceiq --no-owner --no-acl | gzip > "$backup"
          echo "Backup written to $backup"
          # Keep the 14 most recent backups.
          ls -1t "$backup_dir"/traceiq-*.sql.gz | tail -n +15 | xargs -r rm --

          echo "Updating to $DEPLOY_SHA..."
          git fetch origin main
          git merge --ff-only "$DEPLOY_SHA"

          echo "Building, migrating and starting services..."
          docker compose up -d --build --remove-orphans

          echo "Waiting for API health..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null; then
              echo "API healthy"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy"
          docker compose ps -a
          docker compose logs --tail=100 migrate api
          exit 1
          REMOTE

      - name: Check public health
        run: curl -sf --retry 5 --retry-delay 5 --retry-all-errors https://api.traceiq.run/health

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
