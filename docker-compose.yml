services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traceiq
      POSTGRES_USER: traceiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceiq -d traceiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${VPS_DATABASE_URL}
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "migrate", "--workspace=@traceiq/api"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TRACEIQ_DEPLOYMENT_MODE: ${TRACEIQ_DEPLOYMENT_MODE:-self_hosted}
      API_PORT: 4000
      DATABASE_URL: ${VPS_DATABASE_URL}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}

      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      REPLAY_STORAGE_DRIVER: ${REPLAY_STORAGE_DRIVER:-}
      REPLAY_STORAGE_BUCKET: ${REPLAY_STORAGE_BUCKET:-}
      TRACEIQ_REPLAY_STORAGE_DIR: ${TRACEIQ_REPLAY_STORAGE_DIR:-/var/lib/traceiq/session-replays}
      REPLAY_UPLOAD_TOKEN_SECRET: ${REPLAY_UPLOAD_TOKEN_SECRET:-}

      TRACEIQ_SECRET_ENCRYPTION_KEY: ${TRACEIQ_SECRET_ENCRYPTION_KEY:-}
      TRACEIQ_SYNTHETIC_STORAGE_DIR: ${TRACEIQ_SYNTHETIC_STORAGE_DIR:-/var/lib/traceiq/synthetic-artifacts}

      CENCORI_API_KEY: ${CENCORI_API_KEY:-}
      TRACEIQ_AI_FAST_MODEL: ${TRACEIQ_AI_FAST_MODEL:-}
      TRACEIQ_AI_REASONING_MODEL: ${TRACEIQ_AI_REASONING_MODEL:-}
      TRACEIQ_AI_TIMEOUT_MS: ${TRACEIQ_AI_TIMEOUT_MS:-15000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}

      BACHS_API_BASE_URL: ${BACHS_API_BASE_URL:-}
      BACHS_API_KEY: ${BACHS_API_KEY:-}
      BACHS_WEBHOOK_SECRET: ${BACHS_WEBHOOK_SECRET:-}
      BACHS_PRO_MONTHLY_PRODUCT_ID: ${BACHS_PRO_MONTHLY_PRODUCT_ID:-}
      BACHS_PRO_YEARLY_PRODUCT_ID: ${BACHS_PRO_YEARLY_PRODUCT_ID:-}

      CORS_ORIGINS: ${CORS_ORIGINS:-https://traceiq.run}
      DASHBOARD_URL: https://traceiq.run
      BILLING_DASHBOARD_RETURN_URL: ${BILLING_DASHBOARD_RETURN_URL:-}
      BILLING_PUBLIC_API_URL: ${BILLING_PUBLIC_API_URL:-https://api.traceiq.run}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.traceiq.run}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - replay_data:/var/lib/traceiq/session-replays
      - synthetic_data:/var/lib/traceiq/synthetic-artifacts

  sandbox-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TRACEIQ_DEPLOYMENT_MODE: ${TRACEIQ_DEPLOYMENT_MODE:-self_hosted}
      API_PORT: 4001
      DATABASE_URL: postgresql://traceiq:${POSTGRES_PASSWORD}@postgres:5432/traceiq_billing_test
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}

      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      REPLAY_STORAGE_DRIVER: ${REPLAY_STORAGE_DRIVER:-}
      REPLAY_STORAGE_BUCKET: ${REPLAY_STORAGE_BUCKET:-}
      TRACEIQ_REPLAY_STORAGE_DIR: ${TRACEIQ_REPLAY_STORAGE_DIR:-/var/lib/traceiq/session-replays}
      REPLAY_UPLOAD_TOKEN_SECRET: ${REPLAY_UPLOAD_TOKEN_SECRET:-}

      TRACEIQ_SECRET_ENCRYPTION_KEY: ${TRACEIQ_SECRET_ENCRYPTION_KEY:-}
      TRACEIQ_SYNTHETIC_STORAGE_DIR: ${TRACEIQ_SYNTHETIC_STORAGE_DIR:-/var/lib/traceiq/synthetic-artifacts}

      CENCORI_API_KEY: ${CENCORI_API_KEY:-}
      TRACEIQ_AI_FAST_MODEL: ${TRACEIQ_AI_FAST_MODEL:-}
      TRACEIQ_AI_REASONING_MODEL: ${TRACEIQ_AI_REASONING_MODEL:-}
      TRACEIQ_AI_TIMEOUT_MS: ${TRACEIQ_AI_TIMEOUT_MS:-15000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}

      BACHS_API_BASE_URL: ${BACHS_API_BASE_URL:-}
      BACHS_API_KEY: ${BACHS_API_KEY:-}
      BACHS_WEBHOOK_SECRET: ${BACHS_WEBHOOK_SECRET:-}
      BACHS_PRO_MONTHLY_PRODUCT_ID: ${BACHS_PRO_MONTHLY_PRODUCT_ID:-}
      BACHS_PRO_YEARLY_PRODUCT_ID: ${BACHS_PRO_YEARLY_PRODUCT_ID:-}

      CORS_ORIGINS: "https://traceiq.run,http://localhost:3000,http://127.0.0.1:3000"
      DASHBOARD_URL: http://localhost:3000
      BILLING_DASHBOARD_RETURN_URL: http://localhost:3000
      BILLING_PUBLIC_API_URL: https://billing-test.traceiq.run
      NEXT_PUBLIC_API_URL: https://billing-test.traceiq.run
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - replay_data:/var/lib/traceiq/session-replays
      - synthetic_data:/var/lib/traceiq/synthetic-artifacts

volumes:
  postgres_data:
  replay_data:
  synthetic_data:
