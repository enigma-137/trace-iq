services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traceiq
      POSTGRES_USER: traceiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      TRACEIQ_DEPLOYMENT_MODE: ${TRACEIQ_DEPLOYMENT_MODE:-self_hosted}
      API_PORT: 4000
      DATABASE_URL: ${VPS_DATABASE_URL}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379

      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

      GROQ_API_KEY: ${GROQ_API_KEY}

      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}

      
      CORS_ORIGINS: https://traceiq.run
      DASHBOARD_URL: https://traceiq.run
      NEXT_PUBLIC_API_URL: https://api.traceiq.run
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  postgres_data:
